version: '3.8'

services:
  # ============================================================================
  # 1. PartTrackr Modular Monolith Backend
  # Runs the unified in-process pipeline:
  # Preflight Classifier -> Layout Engine -> Local VLM / Vector OMR -> Voice Router -> Decoder -> Verovio Diff
  # Zero HTTP serialization latency, instant boot (<2s), direct host GPU Ollama access.
  # ============================================================================
  parttrackr-backend:
    image: ghcr.io/qlueconsulting/parttrackr-backend:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: parttrackr_backend
    ports:
      - "8000:8000" # Core Rehearsal API
      - "8005:8005" # Pipeline Gateway API
    volumes:
      - ./storage:/app/storage
      - ./soundfonts:/app/soundfonts
    environment:
      - IN_PROCESS_MODE=true
      - STORAGE_DIR=/app/storage
      - SOUNDFONT_PATH=/app/soundfonts/GeneralUser_GS.sf2
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - OLLAMA_MODEL=qwen2.5vl:7b
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    extra_hosts:
      # Direct sub-millisecond bridge to your host machine's dual RTX 2060 GPUs
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped
    networks:
      - parttrackr_net

  # ============================================================================
  # 2. React / Vite Diagnostic & Rehearsal Player UI
  # ============================================================================
  parttrackr-ui:
    image: ghcr.io/qlueconsulting/parttrackr-ui:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: parttrackr_ui
    ports:
      - "8001:8001"
    environment:
      - VITE_GATEWAY_URL=http://localhost:8005
      - VITE_BACKEND_URL=http://localhost:8000
    depends_on:
      - parttrackr-backend
    restart: unless-stopped
    networks:
      - parttrackr_net

networks:
  parttrackr_net:
    driver: bridge
