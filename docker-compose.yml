version: '3.8'

services:
  parttrackr:
    build:
      context: .
      dockerfile: Dockerfile
    image: parttrackr:latest
    container_name: parttrackr_service
    ports:
      - "8000:8000"
    volumes:
      - ./storage:/app/storage
    environment:
      - AUDIVERIS_CMD=/usr/local/bin/audiveris
      - FLUIDSYNTH_CMD=fluidsynth
      - FFMPEG_CMD=ffmpeg
      - SOUNDFONT_PATH=/usr/share/sounds/sf2/FluidR3_GM.sf2
      - DATABASE_URL=sqlite:////app/storage/parttrackr.db
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
