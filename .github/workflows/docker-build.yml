name: Build & Push Microservice Docker Images

on:
  push:
    branches:
      - 'backend-only'
      - 'backend_only'
      - 'backend*only*'
      - 'main'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    name: Build & Push ${{ matrix.service.name }} to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: parttrackr-backend
            context: .
            dockerfile: Dockerfile
          - name: parttrackr-gateway
            context: .
            dockerfile: services/gateway_svc/Dockerfile
          - name: parttrackr-layout
            context: .
            dockerfile: services/pdf_layout_svc/Dockerfile
          - name: parttrackr-omr
            context: .
            dockerfile: services/omr_ai_svc/Dockerfile
          - name: parttrackr-router
            context: .
            dockerfile: services/voice_router_svc/Dockerfile
          - name: parttrackr-decoder
            context: .
            dockerfile: services/decoder_xml_svc/Dockerfile
          - name: parttrackr-ui
            context: ./frontend
            dockerfile: ./frontend/Dockerfile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/qlueconsulting/${{ matrix.service.name }}
          tags: |
            type=raw,value=latest
            type=raw,value=backend-only
            type=sha,prefix=sha-

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
